name: setup-godot
description: Install the pinned headless-capable Godot editor binary as `godot` and restore the .godot import cache (both cached between runs).
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      id: cache
      with:
        path: ~/godot-bin
        key: godot-${{ env.GODOT_VERSION }}-linux
    - name: Download Godot
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/godot-bin && cd ~/godot-bin
        url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
        curl -fsSL -o godot.zip "$url"
        unzip -q godot.zip && rm godot.zip
        mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && chmod +x godot
    - name: Put godot on PATH
      shell: bash
      run: |
        echo "$HOME/godot-bin" >> "$GITHUB_PATH"
    # The import cache: a cold `godot --import` takes ~15 s, a warm one ~6 s (4 cores, main a77dd4d). Godot re-imports
    # any source whose hash changed, so a stale cache only costs time, never a wrong import. The key moves when an
    # .import file or project.godot changes; restore-keys falls back to the newest cache of any key.
    - uses: actions/cache@v4
      with:
        path: .godot
        key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', '**/*.import') }}
        restore-keys: godot-import-${{ env.GODOT_VERSION }}-
