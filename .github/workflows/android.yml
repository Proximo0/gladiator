# Android emulator smoke test (docs/android.md): export a debug x86_64 APK with the `android_ci` feature (one
# presented bot fight, then quit; online stays on the LAN stub because no EOS credentials exist here), boot an
# x86_64 emulator, install, launch, wait for the ANDROID_CI PASS line and upload logcat + screenshots.
# GitHub-hosted runners only (KVM); never the self-hosted gpu runner. Emulator frame times are not phone numbers.
name: android

on:
  push:
    branches: [main, ramp/android-ci]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  BUILD_TOOLS: 35.0.1
  API_LEVEL: 30
  EMU_MAX_LIGHTS: ""  # set to cap rendering/limits/opengl/max_renderable_lights in the CI copy only
  EMU_GPU: swangle_indirect

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Cache export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-android-templates-only-${{ env.GODOT_VERSION }}
      - name: Android SDK pieces and JDK 17
        shell: bash
        run: |
          echo "JAVA_HOME_17=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
          set +o pipefail  # yes dies of SIGPIPE when sdkmanager exits
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;${BUILD_TOOLS}" "platform-tools" > /tmp/sdk.log 2>&1
          [[ -x "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner" ]] || { tail -n 30 /tmp/sdk.log; exit 1; }
      - name: CI export preset (x86_64 + android_ci feature; not committed)
        shell: bash
        run: |
          python3 -I - export_presets.cfg <<'PY'
          import re, sys
          p = sys.argv[1]
          text = open(p).read()
          head, sep, rest = text.partition('name="Android"')
          assert sep, "Android preset missing"
          nxt = re.search(r"^\[preset\.\d+\]\s*$", rest, re.M)
          i = nxt.start() if nxt else len(rest)
          # the Android preset and its .options section come before the next [preset.N] header
          block, tail = rest[:i], rest[i:]
          for k, v in {"architectures/x86_64": "true", "architectures/arm64-v8a": "false",
                       "architectures/armeabi-v7a": "false", "custom_features": '"android_ci"'}.items():
              block, n = re.subn(r"^%s=.*$" % re.escape(k), "%s=%s" % (k, v), block, flags=re.M)
              assert n == 1, k
          open(p, "w").write(head + sep + block + tail)
          PY
          # Optional emulator-only light cap (off by default). With the old swiftshader_indirect GPU every lit scene
          # shader failed to link (uniforms over GL_MAX_FRAGMENT_UNIFORM_VECTORS=261); swangle_indirect has none.
          # See docs/android.md.
          [[ -z "${EMU_MAX_LIGHTS}" ]] || python3 -I - project.godot "${EMU_MAX_LIGHTS}" <<'PY2'
          import sys
          p, n = sys.argv[1], sys.argv[2]
          text = open(p).read()
          key = "limits/opengl/max_renderable_lights="
          assert key not in text, "project sets max_renderable_lights; update the CI patch"
          text = text.replace("[rendering]\n", "[rendering]\n" + key + n + "\n", 1)
          open(p, "w").write(text)
          PY2
          git diff --stat export_presets.cfg project.godot
      - name: Import and export APK
        shell: bash
        run: |
          godot --headless --path . --import > /tmp/import.log 2>&1 || { tail -n 30 /tmp/import.log; exit 1; }
          tools/export_android.sh
          mkdir -p out/android && cp build/Sandblood-android.apk out/android/
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator, install, play one bot fight
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu ${{ env.EMU_GPU }} -no-snapshot -noaudio -no-boot-anim
          script: tools/android_ci_run.sh build/Sandblood-android.apk out/android 1500
      - name: Show the Godot log and a small fight screenshot
        if: always()
        shell: bash
        run: |
          ls -la out/android
          cat out/android/progress.txt 2>/dev/null || true
          echo "--- godot logcat (first 150 lines) ---"
          grep -vE "SceneShaderGLES3|GL_MAX_FRAGMENT|shader_gles3|Method/function failed|^.{0,40}godot +\( *[0-9]+\): *([0-9]+: *)?$" out/android/godot.txt | head -n 80 || true
          echo "shader link failures: $(grep -c 'Program linking failed' out/android/godot.txt || true)"
          # Artifacts are not always reachable from where the log is read, so the game's 256 px mid-fight JPEG
          # goes into the log as base64 between markers (decode with base64 -d).
          if [[ -s out/android/fight_small.jpg ]]; then
            echo "FIGHT_JPG_BEGIN"; base64 -w 120 out/android/fight_small.jpg; echo "FIGHT_JPG_END"
          else
            echo "no fight_small.jpg"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator
          path: |
            out/android/*.txt
            out/android/*.png
            out/android/*.jpg
          if-no-files-found: ignore
